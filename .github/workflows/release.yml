name: release

# Тег v* → опубликованный релиз с универсальным .dmg (Apple Silicon + Intel).
# Версия тега берётся из src-tauri/tauri.conf.json
on:
  push:
    tags: ['v*']

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Vibecraft v__VERSION__
          releaseBody: 'Первый запуск: правый клик по Vibecraft.app → «Открыть» (приложение подписано ad-hoc, без Apple Developer ID).'
          releaseDraft: false
          args: --target universal-apple-darwin
