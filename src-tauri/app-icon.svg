<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Блок Vibecraft: кубик-материал, на грани — промпт агента. Исходник иконки: pnpm tauri icon src-tauri/app-icon.svg -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b33"/>
      <stop offset="1" stop-color="#0a0a0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="530" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddd6fe"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="512" cy="530" r="360" fill="url(#glow)"/>

  <!-- изометрический куб: ребро 280, центр (512, 532) -->
  <path d="M512 252 L754.5 392 L512 532 L269.5 392 Z" fill="url(#top)"/>
  <path d="M269.5 392 L512 532 V812 L269.5 672 Z" fill="url(#left)"/>
  <path d="M512 532 L754.5 392 V672 L512 812 Z" fill="url(#right)"/>
  <!-- блики на рёбрах -->
  <path d="M269.5 392 L512 532 L754.5 392" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" stroke-linejoin="round"/>
  <path d="M512 532 V812" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>

  <!-- промпт >_ в плоскости правой грани -->
  <g transform="matrix(0.866 -0.5 0 1 512 532)" fill="none" stroke="#a7f3d0" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <path d="M66 72 L118 140 L66 208"/>
    <path d="M150 208 H222"/>
  </g>
</svg>
